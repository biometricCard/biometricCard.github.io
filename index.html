<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="./style/style.css" />
		<link rel="stylesheet" href="./style/printStyle.css" />

		<title>biometric card</title>
	</head>
	<body>
		<div class="container pirantCntynr">
			<button
				style="margin: 0 20px -31px"
				onclick="gebi('reglage').classList.toggle('n');"
			>
				Settings <img src="./imgs/Settings.svg" alt="" />
			</button>
			<div id="reglage" class="reglage n">
				<div>
					<span>height :</span>
					<input class="inpColor"
						type="number"
						value="8.64"
						step="0.01"
						oninput="prRoot('--heightCrt',this.value+'cm')"
					/>
					cm
					<span>width :</span>
					<input
						type="number"
						value="5.45"
						step="0.01"
						oninput="prRoot('--widthCrt',this.value+'cm')"
					/>
					cm
					<span>number : </span>
					<input id="nmbrCrt" type="number" value="9" step="1" min="1" /> cm
					<br />
					<br />
					<span>Page background color :</span>
					<input
						type="color"
						style="height: 20px;color: #fff; padding: 0px "
						value="#fff"
						oninput="prRoot('--bgPg',this.value)"
					/>
					<br />
					<br />
					<span> padding lat : </span>
					<input
						type="number"
						value="0.5"
						step="0.1"
						oninput="prRoot('--pdngLat',this.value+'cm')"
					/>
					cm
					<span> padding top & bottom : </span>
					<input
						type="number"
						value="0.5"
						step="0.1"
						oninput="prRoot('--pdngTopBtm',this.value+'cm')"
					/>
					cm
					<span> gap : </span>
					<input
						type="number"
						value="1.0"
						step="0.1"
						oninput="prRoot('--vrGap',this.value+'cm')"
					/>
					cm
				</div>
			</div>

			<!-- face of card -->
			<h2>page 1</h2>

			<div class="upldImg">
				<label for="inputFace" id="drop-area">
					<input type="file" accept="image/*" id="inputFace" hidden />
					<div class="img-view">
						<img
							id="uploadedImageF"
							src="./imgs/icon.png"
							alt="upload image"
						/><br />
						upload image
						<span id="errImgFace" style="color: red; display: none"
							>Error upload Image</span
						>
					</div>
				</label>
			</div>
			<div id="pageFc" class="ferPage print-area">
				<!-- <div id="clonDiv" style="position: absolute; z-index: -1"></div> -->
				<img class="box boxF" src="./imgs/face.jpg" alt="" />
			</div>

			<div class="dvBtn">
				<button onclick="downloadPDF('pageFc', 'face',this)">
					<div id="ptpageFc" class="n"></div>
					Download PDF
				</button>
				<button onclick="printDiv('pageFc')">
					print <img src="./imgs/print.svg" alt="" />
				</button>
			</div>
			<div style="height: 50px"></div>
			<!-- Back of card -->

			<h2>page 2</h2>
			<div class="upldImg">
				<label for="inputBack" id="drop-area">
					<input type="file" accept="image/*" id="inputBack" hidden />
					<div class="img-view">
						<img
							id="uploadedImageB"
							src="./imgs/icon.png"
							alt="upload image"
						/><br />
						upload image
						<span id="errImgFace" style="color: red; display: none"
							>Error upload Image</span
						>
					</div>
				</label>
			</div>
			<div style="margin-top: -40px">
				<button onclick="rotation()" style="margin: 0 20px 20px">
					Rotation <img src="./imgs/rotation.svg" alt="" />
				</button>
			</div>
			<div id="pageBack" class="ferPage pg2">
				<!-- <div id="clonDiv2" style="position: absolute; z-index: -1"></div> -->
				<img class="box boxB" src="./imgs/back.jpg" alt="" />
			</div>
			<div class="dvBtn">
				<button onclick="downloadPDF('pageBack', 'Back',this)">
					<div id="ptpageBack" class="n"></div>
					Download PDF
				</button>
				<button onclick="printDiv('pageBack','pg2')">
					print <img src="./imgs/print.svg" alt="" />
				</button>
			</div>
			<br />
			<div class="dvBtn">
				<button onclick="downloadMultiPagePDF(this)">
					<div id="ptDblPg" class="n"></div>
					Download 2 pages as PDF
				</button>
			</div>
		</div>
		<div id="prntRslt" class="print-area n"></div>
		<script src="./js/html2canvas.min.js"></script>
		<script src="./js/jspdf.umd.min.js"></script>

		<script src="./js/navbar.js"></script>
		<script src="./js/js.js"></script>
		<script src="./js/print.js"></script>
	</body>
</html>
